name: LaptraceLogger
options:
  bundleIdPrefix: com.laptrace
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LaptraceLogger:
    type: application
    platform: iOS
    sources:
      - path: Laptrace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laptrace.logger
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Laptrace
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Laptrace records your GPS track to time laps and analyse your driving."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Laptrace keeps recording while the screen is locked, and with Auto-record drives on, starts recording a drive by itself when you begin driving."
        INFOPLIST_KEY_NSMotionUsageDescription: "Laptrace records acceleration to measure braking and cornering g-forces."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Laptrace/Info.plist
      properties:
        UIBackgroundModes: [location]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  LaptraceCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LaptraceLogger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LaptraceLogger.app/LaptraceLogger"
        BUNDLE_LOADER: "$(TEST_HOST)"
